[package]
name = "palaver"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
futures-channel = "0.3"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
unicode-segmentation = "1"
# The placeholder line generator's engine: llama.cpp, compiled from source (cmake and a
# C++ toolchain), which is why it is optional. See src/llama.rs.
llama-cpp-2 = { version = "0.1.161", optional = true }

[features]
# A socket that scripts drive the editor through, for screenshots. See src/automation.rs.
automation = []
# Placeholder lines from a local model. Off by default so `cargo run` needs no C++ build.
generate = ["dep:llama-cpp-2"]
